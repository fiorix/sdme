<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% if page is defined and page.description %}{{ page.description }}{% else %}{{ config.description }}{% endif %}">
<script src="{{ get_url(path='js/theme.js') }}"></script>
<link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ get_url(path='/') }}" aria-label="sdme home"><svg class="logo-icon" viewBox="83.97 0 788.87 788.93" width="36" height="36" aria-hidden="true"><image href="{{ get_url(path='logo.svg') }}" width="956.81" height="1068.98"/></svg><span>sdme</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ get_url(path='/') }}#tutorials">Tutorials</a>
      <a href="{{ get_url(path='/') }}#documentation">Documentation</a>
      <a href="{{ get_url(path='/') }}#downloads">Downloads</a>
    </nav>
    <div class="header-right">
      <a class="github-link" href="https://github.com/fiorix/sdme">GitHub <span aria-hidden="true">&nearr;</span></a>
      <div class="header-meta">
        <span id="version-badge" class="version-badge"></span>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle color theme">
          <svg id="icon-sun" viewBox="0 0 16 16" style="display:none"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 1.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.06a.75.75 0 0 1-1.06 1.061l-1.06-1.06a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061ZM0 8a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 8Zm13 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5A.75.75 0 0 1 13 8ZM2.343 13.657a.75.75 0 0 1 0-1.06l1.06-1.061a.75.75 0 0 1 1.061 1.06l-1.06 1.061a.75.75 0 0 1-1.06 0Zm9.193-9.193a.75.75 0 0 1 0-1.06l1.061-1.061a.75.75 0 0 1 1.06 1.06l-1.06 1.061a.75.75 0 0 1-1.06 0Z"/></svg>
          <svg id="icon-moon" viewBox="0 0 16 16"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.221-7.832Z"/></svg>
        </button>
      </div>
    </div>
  </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <span>sdme <span class="footer-separator" aria-hidden="true">/</span> The systemd machine editor</span>
    <a href="https://github.com/fiorix/sdme">Source on GitHub &nearr;</a>
  </footer>

<script src="{{ get_url(path='js/version-badge.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
